name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  determine-env:
    name: Environment Resolution
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      site_url: ${{ steps.set-env.outputs.site_url }}
    steps:
      - id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.environment }}" == "production" ]]; then
              echo "site_url=https://portfolio.dev" >> "$GITHUB_OUTPUT"
            else
              echo "site_url=https://staging.portfolio.dev" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "site_url=https://portfolio.dev" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "site_url=https://staging.portfolio.dev" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Gate
    needs: [determine-env]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage --workspace=apps/web
      # next/font fetches Google Fonts at build time; a rate-limited runner IP
      # fails the build with a null font URL. Retry so a network hiccup does
      # not block a deploy.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "::warning::web build attempt ${attempt} failed (likely next/font fetch)"
          done
          exit 1
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ needs.determine-env.outputs.site_url }}

  deploy-web:
    name: Deploy Web (Vercel)
    needs: [determine-env, quality]
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.determine-env.outputs.environment }}
      url: ${{ needs.determine-env.outputs.site_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Deploy to Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::VERCEL_TOKEN not configured. Skipping Vercel deploy."
            exit 0
          fi
          if [[ "${{ needs.determine-env.outputs.environment }}" == "production" ]]; then
            npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ needs.determine-env.outputs.site_url }}

  smoke-test:
    name: Post-Deploy Smoke Tests
    needs: [determine-env, deploy-web]
    if: needs.deploy-web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Health check web
        if: needs.determine-env.outputs.site_url != 'https://portfolio.dev'
        run: |
          STATUS=$(curl -sI ${{ needs.determine-env.outputs.site_url }} -o /dev/null -w '%{http_code}')
          if [[ "$STATUS" != "200" && "$STATUS" != "301" && "$STATUS" != "307" ]]; then
            echo "::error::Web health check failed with status $STATUS"
            exit 1
          fi
          echo "::notice::Web health check passed ($STATUS)"

      - name: Rollback instructions
        if: failure()
        run: |
          echo "::error::============================================"
          echo "::error::  SMOKE TESTS FAILED - ROLLBACK REQUIRED"
          echo "::error::============================================"
          echo "::error::"
          echo "::error::Vercel rollback command:"
          echo "::error::  npx vercel rollback --token=\$VERCEL_TOKEN"
          echo "::error::"
          echo "::error::Or re-run this workflow with the previous commit:"
          echo "::error::  gh workflow run deploy.yml --ref <previous-stable-sha>"
