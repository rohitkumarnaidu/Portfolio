[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "portfolio-ai"
version = "1.0.0"
description = "AI service for Portfolio platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.2",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.10",
    "langchain-anthropic>=0.2.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31.0",
    "redis>=5.2.0",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27.2",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep the rule set explicit so a newer ruff release cannot silently change
# what CI enforces. This matches ruff's historical default (E4, E7, E9, F).
select = ["E4", "E7", "E9", "F"]
