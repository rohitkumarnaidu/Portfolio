version: 2
updates:
  # npm workspaces: this single entry covers apps/web and packages/*
  # because Dependabot reads the `workspaces` field in the root package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automated
    versioning-strategy: increase
    groups:
      # Minor and patch bumps land as one reviewable PR instead of dozens.
      # Major bumps stay separate because they need individual migration work.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=23.0.0']
      # `postprocessing` caps its three peer at `<0.185.0`, so a newer three
      # cannot hoist. npm then installs a second copy under apps/web and
      # TypeScript treats the two @types/three trees as different types.
      # Re-enable minor bumps once postprocessing supports a newer three.
      - dependency-name: 'three'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
      - automated
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
      - automated
