name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage --workspace=apps/web

      # next/font downloads Google Fonts at build time. Shared runner IPs
      # occasionally get a rate-limited CSS response, which makes Next throw
      # "Cannot read properties of null" while parsing the font URL. That is a
      # network failure, not a code failure, so retry before failing the gate.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            if npm run build --workspace=apps/web; then exit 0; fi
            echo "::warning::web build attempt ${attempt} failed (likely next/font fetch)"
          done
          exit 1

      - name: Bundle analysis
        run: npm run analyze
        working-directory: apps/web
        continue-on-error: true
        env:
          ANALYZE: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: apps/*/coverage/
          retention-days: 14

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run audit
        run: npm audit --audit-level=high || echo "::warning::Audit vulnerabilities found"
        continue-on-error: true

  docker-build:
    name: Docker Build (web)
    needs: [quality, npm-audit]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Downcase repository name and prepare context
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          cp package-lock.json apps/web/ 2>/dev/null || true
          if [ -d "packages" ]; then
            cp -r packages apps/web/ 2>/dev/null || true
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/web:latest
            ghcr.io/${{ env.REPO_LOWER }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
