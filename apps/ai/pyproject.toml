[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "portfolio-ai"
version = "1.0.0"
description = "AI service for Portfolio platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.10",
    "langchain-anthropic>=0.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "redis>=5.2.0",
    "tiktoken>=0.14.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.28.1",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep the rule set explicit so a newer ruff release cannot silently change
# what CI enforces. This matches ruff's historical default (E4, E7, E9, F).
select = ["E4", "E7", "E9", "F"]
