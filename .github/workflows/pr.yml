name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace=apps/web

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next/font downloads Google Fonts at build time. Shared runner IPs
      # occasionally get a rate-limited CSS response, which makes Next throw
      # "Cannot read properties of null" while parsing the font URL. That is a
      # network failure, not a code failure, so retry before failing the gate.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            if npm run build --workspace=apps/web; then exit 0; fi
            echo "::warning::web build attempt ${attempt} failed (likely next/font fetch)"
          done
          exit 1
